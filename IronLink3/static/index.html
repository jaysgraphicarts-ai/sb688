<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IronLink3 · Stitch Brick Control Room</title>
<style>
:root{color-scheme:dark;--gold:#d4af37;--ink:#070707;--panel:#111;--muted:#999;--ok:#51d88a;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#251f0d,var(--ink) 38%);font:14px system-ui;color:#eee}header,main{max-width:1280px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #453a16}h1{margin:0;color:var(--gold);letter-spacing:.08em}small,.muted{color:var(--muted)}button,input{background:#080808;color:#eee;border:1px solid #514719;border-radius:6px;padding:10px}button{cursor:pointer;color:var(--gold)}button:hover{background:#211d0d}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input{min-width:330px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:linear-gradient(145deg,#151515,#0b0b0b);border:1px solid #2c281b;border-left:3px solid var(--gold);padding:16px;border-radius:8px}.card h3{margin:0 0 8px}.tag{float:right;font-size:11px;padding:3px 7px;border:1px solid #444;border-radius:999px}.ok{color:var(--ok)}.bad{color:var(--bad)}pre{white-space:pre-wrap;background:#050505;border:1px solid #252525;padding:14px;min-height:90px;max-height:260px;overflow:auto}section{margin-top:22px}
</style></head><body><header><div><h1>IRONLINK3 CONTROL ROOM</h1><small>One owner gate · Entire Stitch Brick technology registry</small></div><div id="link" class="bad">LOCKED</div></header><main>
<div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="Owner access token"><button onclick="loadStatus()">Unlock / Refresh</button><button onclick="post('/api/verify')">Verify</button><button onclick="post('/api/checkpoint')">Checkpoint</button><button onclick="post('/api/ironlink3/connect')">Connect IronLink3</button></div>
<section><div id="summary" class="card">Enter the owner token to load verified status.</div></section>
<section><h2>Stitch Brick Registry</h2><div id="modules" class="grid"></div></section>
<section><h2>Proof / Operations</h2><pre id="output">No command executed.</pre></section>
</main><script>
const token=()=>document.querySelector('#token').value;const nonce=()=>crypto.randomUUID()+crypto.randomUUID();
async function request(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw new Error(j.error||JSON.stringify(j));return j}
function render(s){const l=s.ironlink3;document.querySelector('#link').textContent=l.connected?'IRONLINK3 VERIFIED':'IRONLINK3 DISCONNECTED';document.querySelector('#link').className=l.connected?'ok':'bad';document.querySelector('#summary').innerHTML=`<b>Trust:</b> ${s.trust} &nbsp; <b>Checkpoint:</b> ${s.checkpoint} &nbsp; <b>Ledger:</b> ${s.ledger_head}<br><span class="muted">Protocol ${l.protocol}; ${l.last_error||'signed link healthy'}</span>`;document.querySelector('#modules').innerHTML=s.modules.map(m=>`<article class="card"><span class="tag ${m.health==='healthy'?'ok':''}">${m.health}</span><h3>${m.name}</h3><div class="muted">${m.module_id} · ${m.plane}</div><p>Authority: ${m.authority}<br>Integration: ${m.integration}</p>${m.integration!=='external'?`<button onclick="heal('${m.module_id}')">Heal / Validate</button>`:''}</article>`).join('')}
async function loadStatus(){try{render(await request('/api/status'))}catch(e){show(e)}}async function post(path,body={}){try{const j=await request(path,{method:'POST',headers:{'Content-Type':'application/json','X-Request-Nonce':nonce()},body:JSON.stringify(body)});show(j);await loadStatus()}catch(e){show(e)}}function heal(id){post('/api/heal',{module_id:id})}function show(x){document.querySelector('#output').textContent=x instanceof Error?x.message:JSON.stringify(x,null,2)}
</script></body></html>
